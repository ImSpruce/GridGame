<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Test</title>

    <link rel="stylesheet" href="./style.css">
    
</head>

<body>
    <!-- Überschrift / Title-->
    <div>
        <h1>Randomness Test</h1>
        <h1>See The Console for the  numbers</h1>
    </div>


    <script>
    let seed0 = 1; // Ein Startwert (Seed)
    
    function mulberry32(seed) {
        return function() {
            let t = (seed += 0x6D2B79F5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    // 1. Generator einmal erstellen
    const generator = mulberry32(seed0);

    // 2. Den Generator aufrufen, um Zahlen zu erhalten
    for (let i = 0; i < 9; i++) {
        console.log(generator()); // Beachte die Klammern () beim Aufruf
    }
    </script>
</body>
</html>
